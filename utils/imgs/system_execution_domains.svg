<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Domain Card Gradients -->
    <linearGradient id="espDomainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="psDomainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#082f49" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="plDomainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.95" />
    </linearGradient>

    <!-- Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Arrowheads -->
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#fbbf24" />
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#34d399" />
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1140" height="600" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <path d="M 0,75 L 1140,75 M 0,150 L 1140,150 M 0,225 L 1140,225 M 0,300 L 1140,300 M 0,375 L 1140,375 M 0,450 L 1140,450 M 0,525 L 1140,525" />
    <path d="M 75,0 L 75,600 M 150,0 L 150,600 M 225,0 L 225,600 M 300,0 L 300,600 M 375,0 L 375,600 M 450,0 L 450,600 M 525,0 L 525,600 M 600,0 L 600,600 M 675,0 L 675,600 M 750,0 L 750,600 M 825,0 L 825,600 M 900,0 L 900,600 M 975,0 L 975,600 M 1050,0 L 1050,600" />
  </g>

  <!-- Title Section -->
  <text x="570" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="1">
    THREE-DOMAIN HETEROGENEOUS SYSTEM ARCHITECTURE
  </text>
  <text x="570" y="58" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
    Decoupled Execution Domains: External SPI Harness (ESP32) ── Cortex-A9 Supervisor (PS) ── Artix-7 Accelerators (PL)
  </text>

  <!-- ========================================================================= -->
  <!-- DOMAIN 1: ESP32-WROOM TEST HARNESS                                       -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 80)">
    <rect width="320" height="490" rx="12" fill="url(#espDomainGrad)" stroke="#10b981" stroke-width="2" filter="url(#cardShadow)" />
    
    <!-- Header Badge -->
    <rect x="15" y="15" width="290" height="34" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.2" />
    <text x="160" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ecfdf5">
      DOMAIN 1: ESP32-WROOM HARNESS
    </text>

    <!-- Subtitle Spec -->
    <text x="160" y="68" text-anchor="middle" font-family="monospace" font-size="10" fill="#6ee7b7">
      Xtensa Dual-Core @ 240 MHz • ESP-IDF v6.1
    </text>

    <!-- Card 1: Synthetic Telemetry Generator -->
    <g transform="translate(15, 80)">
      <rect width="290" height="78" rx="8" fill="#022c22" stroke="#059669" stroke-width="1" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0">
        Synthetic Telemetry Engine
      </text>
      <text x="15" y="40" font-family="monospace" font-size="9.5" fill="#d1fae5">• Fixed Frames: 256 B, 512 B, 1024 B</text>
      <text x="15" y="55" font-family="monospace" font-size="9.5" fill="#d1fae5">• Non-stationary physical metrics</text>
      <text x="15" y="70" font-family="monospace" font-size="9.5" fill="#d1fae5">• UNIX timestamp + Sensor CRC16</text>
    </g>

    <!-- Card 2: SPI Master Controller -->
    <g transform="translate(15, 170)">
      <rect width="290" height="85" rx="8" fill="#022c22" stroke="#059669" stroke-width="1" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0">
        Hardware SPI Master
      </text>
      <text x="15" y="40" font-family="monospace" font-size="9.5" fill="#d1fae5">• Mode 0 (CPOL=0, CPHA=0)</text>
      <text x="15" y="55" font-family="monospace" font-size="9.5" fill="#d1fae5">• SCK Frequency: Up to 25 MHz</text>
      <text x="15" y="70" font-family="monospace" font-size="9.5" fill="#d1fae5">• Header J7: SCK, MOSI, MISO, SS</text>
    </g>

    <!-- Card 3: Autonomous Trigger Input -->
    <g transform="translate(15, 267)">
      <rect width="290" height="68" rx="8" fill="#022c22" stroke="#059669" stroke-width="1" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0">
        Autonomous Trigger Receptor
      </text>
      <text x="15" y="40" font-family="monospace" font-size="9.5" fill="#d1fae5">• GPIO 32: Interrupt-driven input</text>
      <text x="15" y="55" font-family="monospace" font-size="9.5" fill="#d1fae5">• Initiates burst feed upon PS trigger</text>
    </g>

    <!-- Card 4: Performance Reporter -->
    <g transform="translate(15, 347)">
      <rect width="290" height="80" rx="8" fill="#022c22" stroke="#059669" stroke-width="1" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#a7f3d0">
        Telemetry Egress &amp; Logger
      </text>
      <text x="15" y="40" font-family="monospace" font-size="9.5" fill="#d1fae5">• Ingests Ciphertext &amp; Cycle Counts</text>
      <text x="15" y="55" font-family="monospace" font-size="9.5" fill="#d1fae5">• Computes CR &amp; End-to-End Latency</text>
      <text x="15" y="70" font-family="monospace" font-size="9.5" fill="#d1fae5">• Dumps CSV over UART (115200 bps)</text>
    </g>

    <!-- Status pill -->
    <rect x="25" y="445" width="270" height="26" rx="13" fill="#047857" />
    <text x="160" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">
      AUTONOMOUS EXTERNAL STIMULUS
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- DOMAIN 2: ZYNQ PROCESSING SYSTEM (PS)                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(410, 80)">
    <rect width="320" height="490" rx="12" fill="url(#psDomainGrad)" stroke="#0284c7" stroke-width="2" filter="url(#cardShadow)" />
    
    <!-- Header Badge -->
    <rect x="15" y="15" width="290" height="34" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="1.2" />
    <text x="160" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f0f9ff">
      DOMAIN 2: ZYNQ PS (ARM CPU)
    </text>

    <!-- Subtitle Spec -->
    <text x="160" y="68" text-anchor="middle" font-family="monospace" font-size="10" fill="#7dd3fc">
      Dual Cortex-A9 @ 667 MHz • 512 MB DDR3
    </text>

    <!-- Card 1: SPI1 EMIO Controller -->
    <g transform="translate(15, 80)">
      <rect width="290" height="78" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#bae6fd">
        SPI1 Slave Ingress / Egress
      </text>
      <text x="15" y="40" font-family="monospace" font-size="9.5" fill="#e0f2fe">• Native Cadence SPI via EMIO pins</text>
      <text x="15" y="55" font-family="monospace" font-size="9.5" fill="#e0f2fe">• 128-byte RX/TX FIFO handling</text>
      <text x="15" y="70" font-family="monospace" font-size="9.5" fill="#e0f2fe">• CRC16 packet verification</text>
    </g>

    <!-- Card 2: SW Baseline & Benchmark Orchestrator -->
    <g transform="translate(15, 170)">
      <rect width="290" height="85" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#bae6fd">
        Pure SW Reference Models
      </text>
      <text x="15" y="40" font-family="monospace" font-size="9.5" fill="#e0f2fe">• C11 Heatshrink LZSS Compressor</text>
      <text x="15" y="55" font-family="monospace" font-size="9.5" fill="#e0f2fe">• C11 NIST SP 800-38A AES-128-CTR</text>
      <text x="15" y="70" font-family="monospace" font-size="9.5" fill="#e0f2fe">• 2x2 Factorial Matrix Dispatcher</text>
    </g>

    <!-- Card 3: Memory Stager & PMU Instrumentation -->
    <g transform="translate(15, 267)">
      <rect width="290" height="75" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#bae6fd">
        Memory Stager &amp; ARM PMU
      </text>
      <text x="15" y="40" font-family="monospace" font-size="9.5" fill="#e0f2fe">• Fast 32-bit memcpy via M_AXI_GP0</text>
      <text x="15" y="55" font-family="monospace" font-size="9.5" fill="#e0f2fe">• CP15 PMCCNTR Cycle Counter</text>
      <text x="15" y="70" font-family="monospace" font-size="9.5" fill="#e0f2fe">• Zero-DMA Staging (No SG Hangs)</text>
    </g>

    <!-- Card 4: Autonomous Trigger Generator -->
    <g transform="translate(15, 354)">
      <rect width="290" height="73" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#bae6fd">
        Hardware Trigger Generator
      </text>
      <text x="15" y="40" font-family="monospace" font-size="9.5" fill="#e0f2fe">• PS EMIO GPIO -> PMOD JA1 (Y18)</text>
      <text x="15" y="55" font-family="monospace" font-size="9.5" fill="#e0f2fe">• Generates 30 ms active-low pulse</text>
      <text x="15" y="70" font-family="monospace" font-size="9.5" fill="#e0f2fe">• Fully hands-free test automation</text>
    </g>

    <!-- Status pill -->
    <rect x="25" y="445" width="270" height="26" rx="13" fill="#0284c7" />
    <text x="160" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">
      SYSTEM SUPERVISOR &amp; BENCHMARK CORE
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- DOMAIN 3: ZYNQ PROGRAMMABLE LOGIC (PL)                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(790, 80)">
    <rect width="320" height="490" rx="12" fill="url(#plDomainGrad)" stroke="#a855f7" stroke-width="2" filter="url(#cardShadow)" />
    
    <!-- Header Badge -->
    <rect x="15" y="15" width="290" height="34" rx="6" fill="#6b21a8" stroke="#c084fc" stroke-width="1.2" />
    <text x="160" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#faf5ff">
      DOMAIN 3: ZYNQ PL (FPGA FABRIC)
    </text>

    <!-- Subtitle Spec -->
    <text x="160" y="68" text-anchor="middle" font-family="monospace" font-size="10" fill="#d8b4fe">
      Artix-7 Logic @ 100 MHz • Dual-Port BRAM
    </text>

    <!-- Card 1: lzss_accel -->
    <g transform="translate(15, 80)">
      <rect width="290" height="85" rx="8" fill="#2e1065" stroke="#9333ea" stroke-width="1" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#e9d5ff">
        lzss_accel (Compression Core)
      </text>
      <text x="15" y="40" font-family="monospace" font-size="9.5" fill="#f3e8ff">• Heatshrink-compatible dictionary</text>
      <text x="15" y="55" font-family="monospace" font-size="9.5" fill="#f3e8ff">• 256 B Window (W=8) • 16 B Lookahead</text>
      <text x="15" y="70" font-family="monospace" font-size="9.5" fill="#f3e8ff">• Dynamic bitstream byte packing</text>
      <text x="15" y="85" font-family="monospace" font-size="9.5" fill="#f3e8ff">• Latches DST_LEN upon DONE</text>
    </g>

    <!-- Card 2: aes_accel -->
    <g transform="translate(15, 177)">
      <rect width="290" height="85" rx="8" fill="#2e1065" stroke="#9333ea" stroke-width="1" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#e9d5ff">
        aes_accel (Cryptographic Core)
      </text>
      <text x="15" y="40" font-family="monospace" font-size="9.5" fill="#f3e8ff">• NIST FIPS-197 / SP 800-38A CTR</text>
      <text x="15" y="55" font-family="monospace" font-size="9.5" fill="#f3e8ff">• 128-bit iterative round datapath</text>
      <text x="15" y="70" font-family="monospace" font-size="9.5" fill="#f3e8ff">• On-the-fly keystream XOR stream</text>
      <text x="15" y="85" font-family="monospace" font-size="9.5" fill="#f3e8ff">• Sequential 10-cycle key expansion</text>
    </g>

    <!-- Card 3: Dual-Port BRAM Buffers -->
    <g transform="translate(15, 274)">
      <rect width="290" height="75" rx="8" fill="#2e1065" stroke="#9333ea" stroke-width="1" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#e9d5ff">
        Shared True Dual-Port BRAMs
      </text>
      <text x="15" y="40" font-family="monospace" font-size="9.5" fill="#f3e8ff">• Port A: AXI BRAM Ctrl (PS memcpy)</text>
      <text x="15" y="55" font-family="monospace" font-size="9.5" fill="#f3e8ff">• Port B: Dedicated 100 MHz Core Bus</text>
      <text x="15" y="70" font-family="monospace" font-size="9.5" fill="#f3e8ff">• 0 bus contention during execution</text>
    </g>

    <!-- Card 4: Hardware Cycle Counters -->
    <g transform="translate(15, 361)">
      <rect width="290" height="66" rx="8" fill="#2e1065" stroke="#9333ea" stroke-width="1" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#e9d5ff">
        HW Instrumentation Units
      </text>
      <text x="15" y="40" font-family="monospace" font-size="9.5" fill="#f3e8ff">• Dedicated 32-bit CYCLE_COUNT registers</text>
      <text x="15" y="55" font-family="monospace" font-size="9.5" fill="#f3e8ff">• Increments strictly when BUSY=1</text>
    </g>

    <!-- Status pill -->
    <rect x="25" y="445" width="270" height="26" rx="13" fill="#7c3aed" />
    <text x="160" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">
      DETERMINISTIC COPROCESSORS
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- INTER-DOMAIN BUS LABELS & ARROWS                                         -->
  <!-- ========================================================================= -->

  <!-- ESP32 <-> PS: SPI Connection -->
  <path d="M 350,210 L 410,210" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrGreen)" />
  <rect x="352" y="190" width="56" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="380" y="203" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#a7f3d0">SPI</text>

  <!-- PS -> ESP32: Trigger Line -->
  <path d="M 410,400 L 350,400" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrAmber)" />
  <rect x="352" y="405" width="56" height="18" rx="4" fill="#78350f" stroke="#f59e0b" stroke-width="1" />
  <text x="380" y="418" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#fde68a">TRIGGER</text>

  <!-- PS <-> PL: M_AXI_GP0 Interconnect -->
  <path d="M 730,230 L 790,230" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrCyan)" />
  <rect x="732" y="208" width="56" height="18" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="1" />
  <text x="760" y="221" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#e0f2fe">AXI GP0</text>

  <path d="M 790,320 L 730,320" fill="none" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrPurple)" />
  <rect x="732" y="325" width="56" height="18" rx="4" fill="#581c87" stroke="#a855f7" stroke-width="1" />
  <text x="760" y="338" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#f3e8ff">BRAM-A</text>
</svg>
